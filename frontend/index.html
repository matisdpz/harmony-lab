<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1f26" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before the first paint (same rule as applyTheme in SettingsProvider).
      try {
        var theme = JSON.parse(localStorage.getItem('harmony-lab.settings') || '{}').theme
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) { /* storage unavailable: follow the system */ }
    </script>
    <meta name="description" content="Harmony Lab — explore chords, progressions and voice leading." />
    <title>Harmony Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
